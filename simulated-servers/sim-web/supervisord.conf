[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

[program:php-fpm]
command=php-fpm83 -F
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true

[program:agent]
command=python3 -u /opt/agent/agent.py
autorestart=true
startretries=999
stdout_logfile=/var/log/agent.log
redirect_stderr=true
